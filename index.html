<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Interactiva - CEPIES</title>
    
    <!-- Importando fuentes de Google Fonts (Estilo Candice/Pacifico y Quicksand para lectura) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo-oscuro: #0f172a;
            --fondo-tarjeta: #1e293b;
            --azul-brillante: #3b82f6;
            --rojo-cepies: #EA2027;
            --blanco: #f8fafc;
            --texto-secundario: #94a3b8;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.15rem;
            background: linear-gradient(135deg, var(--fondo-oscuro) 0%, #172554 100%);
            color: var(--blanco);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Estilo Candice / Cursiva para los títulos */
        h1, h2, .titulo-candice {
            font-family: 'Pacifico', cursive;
            font-weight: 400;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            background: transparent;
        }

        .logo {
            max-width: 140px;
            border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(234, 32, 39, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        h1 { font-size: 2.2rem; margin: 0.2rem 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 1px; }
        h2 { font-size: 1.8rem; color: #cbd5e1; margin: 0.2rem 0; font-family: 'Quicksand', sans-serif; font-weight: 600; }
        h3 { font-size: 1.3rem; margin: 0.5rem 0; color: #94a3b8; font-family: 'Quicksand', sans-serif; }
        
        .author { 
            margin-top: 1.5rem; 
            font-size: 1.2rem;
            font-weight: 700; 
            color: #fff; 
            background: var(--rojo-cepies);
            display: inline-block; 
            padding: 8px 25px; 
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(234, 32, 39, 0.4);
            font-family: 'Quicksand', sans-serif;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 1rem auto 4rem;
            position: relative;
        }

        .section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            display: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .section.active {
            display: block;
            animation: fadeInUp 0.5s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 1.8rem; }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #e2e8f0;
            font-size: 1.2rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--azul-brillante);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.9);
        }

        textarea { resize: vertical; min-height: 120px; }

        .btn {
            background: var(--rojo-cepies);
            color: var(--blanco);
            border: none;
            padding: 16px 28px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(234, 32, 39, 0.2);
            margin-top: 15px;
        }

        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(234, 32, 39, 0.4);
        }
        
        .btn-blue { 
            background: var(--azul-brillante);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2);
        }
        
        .btn-blue:hover { 
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            margin-bottom: 15px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .claro-table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 1.5rem 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.5);
            text-align: left;
